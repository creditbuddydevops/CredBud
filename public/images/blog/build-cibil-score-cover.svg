<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CreditBuddy Credit 101 — How to Build Your CIBIL Score from Scratch as a Student">
  <defs>
    <!-- Paper / film grain texture -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Cream background -->
  <rect width="1200" height="630" fill="#FBF7EF"/>
  <rect width="1200" height="630" fill="#FBF7EF" filter="url(#grain)"/>

  <!-- Thick ink frame -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#14100F" stroke-width="6"/>

  <!-- Left brutalist accent stack (lime + purple bars) -->
  <rect x="64" y="96" width="22" height="438" fill="#C8FF3D" stroke="#14100F" stroke-width="5"/>
  <rect x="64" y="96" width="22" height="120" fill="#7B5CFF"/>

  <!-- Top-right category tag -->
  <g transform="translate(906 86)">
    <rect x="0" y="0" width="232" height="58" rx="29" fill="#7B5CFF" stroke="#14100F" stroke-width="5"/>
    <text x="116" y="38" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CREDIT 101</text>
  </g>

  <!-- Eyebrow -->
  <text x="118" y="178" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#6B6259" letter-spacing="2">// student money journal</text>

  <!-- Headline -->
  <text x="114" y="268" font-family="'Bricolage Grotesque', sans-serif" font-size="86" font-weight="800" fill="#14100F" letter-spacing="-3">Build your CIBIL</text>
  <text x="114" y="362" font-family="'Bricolage Grotesque', sans-serif" font-size="86" font-weight="800" fill="#14100F" letter-spacing="-3">score from </text>
  <text x="114" y="456" font-family="'Bricolage Grotesque', sans-serif" font-size="86" font-weight="800" fill="#14100F" letter-spacing="-3">scratch.</text>

  <!-- Purple underline accent on "scratch." -->
  <rect x="116" y="470" width="430" height="20" fill="#7B5CFF" transform="rotate(-1 116 470)"/>

  <!-- Score gauge motif (bottom-right) -->
  <g transform="translate(900 458)">
    <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="#14100F" stroke-width="6"/>
    <!-- arc segments -->
    <path d="M 100 100 L 100 8 A 92 92 0 0 1 192 100 Z" fill="#C8FF3D"/>
    <path d="M 100 100 L 192 100 A 92 92 0 0 1 148 179 Z" fill="#7B5CFF"/>
    <path d="M 100 100 L 148 179 A 92 92 0 0 1 52 179 Z" fill="#FFD23F"/>
    <path d="M 100 100 L 52 179 A 92 92 0 0 1 8 100 Z" fill="#FF5A3C"/>
    <circle cx="100" cy="100" r="52" fill="#FBF7EF" stroke="#14100F" stroke-width="5"/>
    <text x="100" y="92" font-family="'Bricolage Grotesque', sans-serif" font-size="46" font-weight="800" fill="#14100F" text-anchor="middle">750</text>
    <text x="100" y="116" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#6B6259" text-anchor="middle" letter-spacing="1">CIBIL</text>
  </g>

  <!-- Author chip (bottom-left) -->
  <g transform="translate(118 542)">
    <circle cx="26" cy="26" r="26" fill="#FFFFFF" stroke="#14100F" stroke-width="4"/>
    <text x="26" y="34" font-family="'Bricolage Grotesque', sans-serif" font-size="22" font-weight="800" fill="#14100F" text-anchor="middle">DM</text>
    <text x="72" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#14100F">Debasish Mallick</text>
    <text x="72" y="44" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="600" fill="#6B6259" letter-spacing="1">FOUNDER &amp; CEO · 7 MIN READ</text>
  </g>

  <!-- Corner accent dots -->
  <circle cx="56" cy="56" r="10" fill="#C8FF3D" stroke="#14100F" stroke-width="4"/>
  <circle cx="1144" cy="56" r="10" fill="#7B5CFF" stroke="#14100F" stroke-width="4"/>
  <circle cx="56" cy="574" r="10" fill="#FFD23F" stroke="#14100F" stroke-width="4"/>
  <circle cx="1144" cy="574" r="10" fill="#FF5A3C" stroke="#14100F" stroke-width="4"/>
</svg>
